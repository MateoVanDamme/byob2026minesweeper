<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINESWEEPER</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="wall">
  <header class="bar">
    <div class="brand">
      <span class="mark"></span>
      <span class="title">MINESWEEPER</span>
      <span class="sub">SCAN A TILE TO REVEAL IT</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">MINES</span><span class="v" id="s-mines">00</span></div>
      <div class="stat"><span class="k">FLAGS</span><span class="v" id="s-flags">00</span></div>
      <div class="stat"><span class="k">OPEN</span><span class="v" id="s-open">000/000</span></div>
      <div class="stat"><span class="k">TIME</span><span class="v" id="s-time">00:00</span></div>
      <div class="stat"><span class="k">STATUS</span><span class="v" id="s-status">READY</span></div>
      <button class="btn" id="btn-reset" title="Shift+R">RESET</button>
    </div>
  </header>

  <main class="stage">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="panel">
        <div class="panel-k" id="ov-k">STATUS</div>
        <div class="panel-v" id="ov-v">DETONATED</div>
        <div class="panel-s" id="ov-s">PRESS R TO RESET</div>
      </div>
    </div>
    <div class="flash" id="flash"></div>
  </main>

  <footer class="bar foot">
    <span id="f-url">—</span>
    <span class="dim">R RESET · F FULLSCREEN</span>
    <span id="f-game">GAME 00</span>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
